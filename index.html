<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">

<title>World Drive 3D — Ultimate</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body,#map{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#071018;
font-family:Inter,system-ui,sans-serif;
touch-action:none
}

#map{
position:fixed;
inset:0
}

.glass{
background:#07131de8;
color:#fff;
border:1px solid #ffffff35;
backdrop-filter:blur(12px);
box-shadow:0 8px 30px #0009
}

/* SEARCH */

#top{
position:fixed;
z-index:30;
top:max(8px,env(safe-area-inset-top));
left:50%;
transform:translateX(-50%);
width:min(760px,94vw);
display:flex;
gap:6px;
padding:7px;
border-radius:15px
}

#q{
flex:1;
min-width:0;
border:0;
border-radius:10px;
padding:12px;
font-size:15px
}

button{
border:0;
border-radius:10px;
background:#0878b9;
color:#fff;
padding:10px 12px;
font-weight:850
}

/* SPEED */

#hud{
position:fixed;
z-index:25;
left:10px;
top:74px;
padding:10px 14px;
border-radius:14px;
min-width:110px
}

#speed{
font-size:36px;
font-weight:950;
line-height:1
}

.tiny{
font-size:11px;
opacity:.78
}

/* GPS */

#nav{
position:fixed;
z-index:25;
right:10px;
top:74px;
width:min(300px,54vw);
padding:11px;
border-radius:14px
}

#maneuver{
font-size:20px;
font-weight:900;
line-height:1.15
}

#nextdist{
font-size:15px;
font-weight:800;
margin-top:4px
}

#eta{
margin-top:5px
}

#mode{
position:fixed;
z-index:24;
left:10px;
top:177px;
padding:7px 10px;
border-radius:11px;
font-size:11px
}

/* CAR */

#car{
position:fixed;
z-index:19;
left:50%;
bottom:17%;
transform:translateX(-50%);
width:88px;
height:154px;
pointer-events:none;
filter:drop-shadow(0 15px 8px #000b);
perspective:400px
}

.carbody{
position:absolute;
inset:7px 10px;
border-radius:33px 33px 20px 20px;

background:
linear-gradient(
90deg,
#8e6800,
#ffe85a 35%,
#d2a900 67%,
#765400
);

border:2px solid #fff09a;
transform:rotateX(8deg)
}

.wind{
position:absolute;
left:21px;
right:21px;
top:29px;
height:43px;

background:
linear-gradient(
#183b50,
#08151e
);

border-radius:15px 15px 7px 7px;
border:2px solid #8ed8ff55
}

.rear{
position:absolute;
left:18px;
right:18px;
bottom:25px;
height:25px;
background:#161616;
border-radius:5px
}

.lamp{
position:absolute;
bottom:31px;
width:19px;
height:7px;
background:#e62929;
box-shadow:0 0 9px #f22
}

.l1{left:15px}
.l2{right:15px}

/* STEERING WHEEL */

#wheelCtl{
position:fixed;
z-index:35;
left:18px;
bottom:max(20px,env(safe-area-inset-bottom));

width:150px;
height:150px;

border-radius:50%;

background:
radial-gradient(
circle,
#222 0 20%,
transparent 21%
),

conic-gradient(
#111 0 12%,
#555 12% 17%,
#111 17% 45%,
#555 45% 50%,
#111 50% 78%,
#555 78% 83%,
#111 83%
);

border:12px solid #111;

box-shadow:
0 8px 25px #000b,
inset 0 0 0 3px #777;

touch-action:none
}

#wheelCtl:after{
content:"";
position:absolute;
left:50%;
top:50%;
width:16px;
height:58px;
background:#333;
transform:translate(-50%,-50%);
border-radius:8px
}

/* PEDALS */

#pedals{
position:fixed;
z-index:35;
right:18px;
bottom:max(20px,env(safe-area-inset-bottom));

display:flex;
gap:14px;
align-items:flex-end
}

.pedal{
touch-action:none;
color:#ddd;

background:
linear-gradient(
#666,
#222
);

border:2px solid #888;
border-radius:9px 9px 16px 16px;

box-shadow:
0 9px 18px #000a,
inset 0 0 0 3px #333;

font-weight:900;
letter-spacing:.5px
}

#brake{
width:66px;
height:102px
}

#gas{
width:58px;
height:128px
}

.pedal.on{
transform:translateY(8px);
filter:brightness(.75)
}

/* GEAR */

#gear{
position:fixed;
z-index:30;
left:50%;
bottom:12px;

transform:translateX(-50%);

padding:6px 10px;
border-radius:10px;

color:#fff;
font-weight:900;
background:#07131ddd
}

/* WEATHER */

#weather{
position:fixed;
z-index:21;
inset:0;
pointer-events:none;
opacity:0;

transition:.4s;

background:
repeating-linear-gradient(
105deg,
transparent 0 16px,
#b9e9ff55 17px 18px,
transparent 19px 30px
)
}

#shade{
position:fixed;
z-index:20;
inset:0;
pointer-events:none;
transition:.5s;
background:transparent
}

/* MESSAGE */

#toast{
position:fixed;
z-index:50;
left:50%;
top:135px;
transform:translateX(-50%);

padding:8px 12px;
border-radius:10px;

color:#fff;
display:none
}

#credit{
position:fixed;
z-index:23;

left:50%;
bottom:2px;

transform:translateX(-50%);

font-size:8px;
color:#fffb;
text-shadow:0 1px 3px #000;
white-space:nowrap
}

@media(max-width:650px){

#nav{
top:132px;
width:58vw
}

#mode{
top:178px
}

#wheelCtl{
width:125px;
height:125px;
border-width:10px
}

.pedal{
transform:scale(.9);
transform-origin:bottom right
}

#car{
transform:
translateX(-50%)
scale(.8);

bottom:16%
}

}

</style>
</head>

<body>

<div id="map"></div>

<div id="weather"></div>
<div id="shade"></div>

<!-- SEARCH -->

<div id="top" class="glass">

<input
id="q"
placeholder="Search any real place or address">

<button id="go">
ROUTE
</button>

<button id="loc">
⌖
</button>

<button id="fx">
☀
</button>

</div>

<!-- SPEED -->

<div id="hud" class="glass">

<div id="speed">

</div>

<div class="tiny">

</div>

<div id="road" class="tiny">
Abu Dhabi
</div>

</div>

<!-- GPS -->

<div id="nav" class="glass">

<div id="maneuver">
Search a destination
</div>

<div id="nextdist">
Real-road navigation
</div>

<div id="eta" class="tiny">
GPS ready
</div>

</div>

<div id="mode" class="glass">
3D TERRAIN • SATELLITE • BUILDINGS
</div>

<!-- CAR -->

<div id="car">

<div class="carbody"></div>

<div class="wind"></div>

<div class="rear"></div>

<i class="lamp l1"></i>
<i class="lamp l2"></i>

</div>

<!-- STEERING -->

<div id="wheelCtl"></div>

<!-- PEDALS -->

<div id="pedals">

<button
id="brake"
class="pedal">
BRAKE
</button>

<button
id="gas"
class="pedal">
GAS
</button>

</div>

<div id="gear">
D
</div>

<div
id="toast"
class="glass">
</div>

<div id="credit">
© OpenStreetMap contributors · Satellite © Esri · routing by OSRM
</div>
